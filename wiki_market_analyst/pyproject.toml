[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-market-analyst"
version = "1.0.0"
description = "Wikimedia Pageviews Market Intelligence Skill for B2C Product Decision Making"
authors = [{name = "Mykola Shuprovych"}]
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "fpdf2>=2.8.0",
    "numpy>=1.26.0",
]

[project.scripts]
wiki-analyst = "wiki_market_analyst.main:main"
